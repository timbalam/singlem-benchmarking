[workspace]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[environments]
map2b = ["map2b"]
metaphlan = ["metaphlan"]
metaphlan42 = ["metaphlan42"]
sylph = ["sylph"]
opal = ["opal"]
art = ["art"]
singlem-dev = ["singlem-dev"]
singlem = ["singlem"]
start = ["start"]

[feature.map2b.dependencies]
perl="5.*"
perl-parallel-forkmanager="2.*"
python="3.*"
joblib="0.13.*"
scikit-learn="0.24.*"
pandas="1.*"
marisa-trie="0.7.*"

[feature.metaphlan.dependencies]
metaphlan = "==4.0.6"
python = "3.11.*"

[feature.metaphlan42.dependencies]
metaphlan = "==4.2.2"

[feature.sylph.dependencies]
sylph = "==0.8.1"

[feature.opal.dependencies]
cami-opal = "==1.0.11"

[feature.art.dependencies]
python = ">=3.10,<3.14"
art = "*"
pandas = "*"
extern = "*"
polars = "*"
pyarrow = "*"

[feature.singlem-dev.dependencies]
python = ">=3.7"
coreutils = "*" # So sort --parallel works
bash = "*"
diamond = ">=2.1.7,<2.1.11"  # 2.1.11 segfaults (on some non-test data)
biopython = "*"
hmmer = "*"
orfm = "*"
mfqe = "*"
extern = "*"
graftm = "*"
krona = "*"
pplacer = "*"
sra-tools = "*"
ncbi-ngs-sdk = "*"
sqlite = "*"
squarify = "*"
mafft = "*"
seqmagick = "*"
expressbetadiversity = "*"
cd-hit = "*"
fasttree = "*"
fastalite = "*"
jinja2 = "*"
pip = "*"
sqlalchemy = "*"
pandas = "*"
bird_tool_utils_python = ">=0.4.1"
smafa = "*"
pyranges = "*"
polars = "*"
prodigal = "*"
tqdm = "*"
pyarrow = "*"
galah = ">=0.4.0"
sqlparse = "*"  # Required indirectly (e.g. taxtastic)
zenodo_backpack = ">=0.3.0"
# Optional (commented out)
# python-annoy = "*"
# nmslib = "*"

[feature.singlem.pypi-dependencies]
singlem = {path = ".", editable = true}

[feature.singlem.dependencies]
singlem = "==0.18.0"

[feature.start.dependencies]
python = ">=3.10,<3.14"
snakemake = "*"
polars = "*"
extern = "*"
jupyterlab = "*"
nbconvert = "*"
r = "*"
r-irkernel = "*"
"r-data.table" = "*"
r-ggplot2 = "*"
r-ggbeeswarm = "*"
ncbi-datasets-cli = "*"
bird_tool_utils_python = "*"
tqdm = "*"
scipy = "*"
r-ggpubr = "*"
r-patchwork = "*"
r-svglite = "*"
pyarrow = "*"
