[workspace]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[environments]
map2b = ["map2b"]
metaphlan = ["metaphlan"]
metaphlan42 = ["metaphlan42"]
sylph = ["sylph"]

[feature.map2b.dependencies]
perl="5.*"
perl-parallel-forkmanager="2.*"
python="3.*"
joblib="0.13.*"
scikit-learn="0.24.*"
pandas="1.*"
marisa-trie="0.7.*"

[feature.metaphlan.dependencies]
metaphlan = "==4.0.6"
python = "3.11.*"

[feature.metaphlan42.dependencies]
metaphlan = "==4.2.2"

[feature.sylph.dependencies]
sylph = "==0.8.1"
